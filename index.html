<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday surprise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Nunito:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate">
  <div class="gift" aria-hidden="true">🎁</div>
  <h1 id="gateTitle">Someone made you a surprise</h1>
  <p>Turn your sound on, then open it.</p>
  <button id="openBtn">Open your surprise</button>
</div>

<canvas id="fx"></canvas>

<main id="stage" class="hidden">
  <h1 id="title"></h1>
  <p id="hint">Make a wish, then blow out the candles.</p>

  <div class="cake" id="cake">
    <div class="glow"></div>
    <div class="candles" id="candles"></div>
    <div class="layer l2"><div class="icing"></div></div>
    <div class="layer l1"><div class="icing"></div></div>
    <div class="plate"></div>
  </div>

  <div class="meter" id="meterWrap" aria-hidden="true"><b id="meter"></b></div>
  <div class="controls" id="controls">
    <button id="micBtn">Blow into the mic</button>
    <button id="blowBtn" class="ghost">Blow out with a button</button>
  </div>

  <section id="msg" aria-live="polite">
    <h2 id="msgTitle"></h2>
    <p id="msgText"></p>
    <p id="msgFrom"></p>
  </section>
  <div class="controls hidden" id="again"><button class="ghost" id="replayBtn">Light the candles again</button></div>
</main>

<script src="script.js"></script>
</body>
</html>
